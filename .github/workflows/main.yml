name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'saputra888'
        required: true
        default: 'saputra888'
      agent_description:
        description: 'saputra888 agent'
        required: true
        default: 'saputra888 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"saputra888","description":"saputra888 AI Agent"}'
